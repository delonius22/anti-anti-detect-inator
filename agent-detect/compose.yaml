# The demo behind nginx, in containers. See deploy/DOCKER.md.
#   cp .env.example .env    # set DEMO_HOST
#   docker compose up -d --build
#
# Only nginx publishes ports. The app is reachable only on the backend network, and
# trusts X-Forwarded-* only from nginx's fixed address there.
name: agent-demo

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128

services:
  app:
    <<: *hardening
    build: .
    image: agent-demo-app
    environment:
      TRUST_PROXY: 172.28.0.10
      DEMO_RETENTION_DAYS: ${DEMO_RETENTION_DAYS:-90}
    volumes:
      - reports:/data
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    networks:
      backend:
        ipv4_address: 172.28.0.20

  nginx:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: agent-demo-nginx
    depends_on:
      app:
        condition: service_healthy
    environment:
      DEMO_HOST: ${DEMO_HOST:?set DEMO_HOST in .env}
      UPSTREAM: 172.28.0.20:3000
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme:/var/www/acme:ro
      - selfsigned:/etc/nginx/selfsigned
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /run
    # The nginx master needs these to bind 80/443 and hand work to its unprivileged workers.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    mem_limit: 128m
    networks:
      backend:
        ipv4_address: 172.28.0.10

  # Let's Encrypt renewals, only with: docker compose --profile letsencrypt up -d certbot
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [letsencrypt]
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/acme
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/acme --quiet; sleep 12h & wait $${!}; done"]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  reports:
  letsencrypt:
  acme:
  selfsigned:
