# nginx site for the demo (server/demo.js). Stock nginx is enough; no custom modules.
#
#   sudo cp nginx/demo.conf /etc/nginx/sites-available/agent-demo
#   sudo sed -i 's/DEMO_HOST/demo.example.com/g' /etc/nginx/sites-available/agent-demo
#   sudo ln -s /etc/nginx/sites-available/agent-demo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The demo listens on 127.0.0.1:3000 only (HOST/PORT), so clients can't skip these limits,
# and it trusts X-Forwarded-* only from loopback, i.e. from this nginx.

# Per client IP. One page load sends one report, so 6/minute is generous for people;
# everything else (page, script, /__agent, signed requests that make the app fetch
# a signer's keys) shares a looser limit.
limit_req_zone $binary_remote_addr zone=demo_reports:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=demo_all:10m    rate=10r/s;

upstream agent_demo { server 127.0.0.1:3000; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name DEMO_HOST;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen ... http2" rather than "http2 on" so Ubuntu 24.04's nginx 1.24 accepts it;
    # nginx 1.25+ only warns that it is deprecated. No IPv6 on the server? Drop the [::] lines.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DEMO_HOST;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/DEMO_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DEMO_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    limit_req_status 429;
    client_max_body_size 16k; # the app's own limit for reports

    # proxy_set_header REPLACES any copy the client sent, so these cannot be forged.
    # The Host the agent signed must reach the app unchanged (Web Bot Auth covers @authority).
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /__agent/report {
        limit_except POST { deny all; }
        limit_req zone=demo_reports burst=5 nodelay;
        proxy_pass http://agent_demo;
    }

    location / {
        limit_req zone=demo_all burst=20 nodelay;
        proxy_pass http://agent_demo;
    }
}
