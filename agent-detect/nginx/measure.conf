# nginx config for the measurement hostname.
# Replace MEASURE_HOST (e.g. m.example.com). Requires nginx built by
# deploy/build-nginx.sh (JA4 module + SYN capture patch + syn-ttl module).

worker_processes auto;
error_log /var/log/nginx-measure/error.log warn;
pid /run/nginx-measure.pid;

events { worker_connections 4096; }

http {
    server_tokens off;
    access_log off;

    log_format fingerprints escape=json
        '{"t":"$time_iso8601","ip":"$remote_addr","port":"$remote_port","req":"$request",'
        '"status":$status,"ja4":"$http_ssl_ja4","ja4h":"$http_ssl_ja4h","ja4t":"$http_ssl_ja4t",'
        '"ttl":"$syn_ttl","hops":"$syn_hops","rtt_us":"$tcpinfo_rtt","ua":"$http_user_agent"}';

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream capture_app { server 127.0.0.1:3000; keepalive 16; }

    # Port 80: ACME renewals and a redirect. Nothing is measured here.
    server {
        listen 80;
        listen [::]:80;
        server_name MEASURE_HOST;
        location /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name MEASURE_HOST;

        tcp_save_syn on;   # JA4T + SYN TTL; costs a little memory per connection

        ssl_certificate     /etc/letsencrypt/live/MEASURE_HOST/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/MEASURE_HOST/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # No resumption: every visit is a full handshake, so the ClientHello's
        # extension list (and JA4) does not change between first and repeat visits.
        ssl_session_cache off;
        ssl_session_tickets off;

        # Probe beacons are 5-15 KB of JSON, over nginx's 8 KB default buffer. Keep bodies in memory
        # (no client_body_temp files) and cap them; the app's own limit is 128 KB.
        client_body_buffer_size 160k;
        client_max_body_size 160k;

        access_log /var/log/nginx-measure/fingerprints.log fingerprints;

        location /ws/ {
            include /etc/nginx-measure/fp-headers.conf;
            proxy_pass http://capture_app;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 30s;
        }

        location / {
            include /etc/nginx-measure/fp-headers.conf;
            proxy_pass http://capture_app;
            proxy_set_header Connection "";
        }
    }
}
