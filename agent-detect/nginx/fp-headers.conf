# Included in every proxied location of measure.conf.
# nginx drops inherited proxy_set_header lines in any block that sets its own,
# so the full set lives here and is included per location.
# proxy_set_header REPLACES any copy the client sent, so these cannot be forged.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Remote-Port     $remote_port;
proxy_set_header X-HTTP-Version    $server_protocol;
proxy_set_header X-JA4             $http_ssl_ja4;
proxy_set_header X-JA4-String      $http_ssl_ja4_string;
proxy_set_header X-JA4H            $http_ssl_ja4h;
proxy_set_header X-JA4H-String     $http_ssl_ja4h_string;
proxy_set_header X-JA4T            $http_ssl_ja4t;
proxy_set_header X-SYN-TTL         $syn_ttl;
proxy_set_header X-SYN-Hops        $syn_hops;
proxy_set_header X-TCP-RTT         $tcpinfo_rtt;
proxy_set_header X-TCP-RTTVAR      $tcpinfo_rttvar;
