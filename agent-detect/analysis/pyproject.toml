[project]
name = "inator-analysis"
version = "0.1.0"
description = "Phase 6 analysis for the Anti-Anti-Detect-inator: signal grading, weight fitting, population checks, exit criteria"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
inator-analysis = "inator_analysis.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["inator_analysis"]
